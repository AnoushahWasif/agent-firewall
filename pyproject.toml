[project]
name = "agent-firewall"
version = "0.1.0"
description = "An AI agent with MCP tools, and the firewall that stops it being turned against its user"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.16",
    "jsonschema>=4.20",
    "mcp>=2.3",
    "numpy>=2.1",
    "pydantic>=2.9",
    "safetensors>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_firewall"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Evaluation cases written inline as TOML: a line break would change the data.
"tests/test_evaluation_run.py" = ["S101", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
