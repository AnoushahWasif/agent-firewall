version: 2

# Weekly, minor and patch bumps grouped per ecosystem. A release has to be a week old before
# it's proposed: hijacked packages are usually caught and pulled within days. Security updates
# are separate (turned on in the repo settings) and skip the wait.
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
